name: CI macOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.1
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -run=^$ -fuzz=FuzzParseDoesNotPanic -fuzztime=5s ./internal/config
      - run: go test -run=^$ -fuzz=FuzzQuote -fuzztime=5s ./internal/shell
      - run: go test -race ./...
      - run: go build -trimpath ./cmd/env-switcher
      - run: GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/env-switcher-darwin-amd64 ./cmd/env-switcher
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/env-switcher-darwin-arm64 ./cmd/env-switcher
