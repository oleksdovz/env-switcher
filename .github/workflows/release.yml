name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.1
      - name: Build artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION -X main.commit=${GITHUB_SHA} -X main.date=$(date -u +%FT%TZ)" \
              -o "dist/env-switcher_${os}_${arch}" ./cmd/env-switcher
          done
          cd dist && sha256sum env-switcher_* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
