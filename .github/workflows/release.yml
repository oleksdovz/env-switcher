name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        default: patch
        options: [patch, minor, major]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.1
      - run: sudo apt-get update && sudo apt-get install --yes zsh
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...

      - name: Compute next version
        id: version
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS='.' read -r major minor patch <<<"${latest#v}"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac
          tag="v${major}.${minor}.${patch}"
          echo "previous=$latest" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "Release ${{ steps.version.outputs.tag }} (${{ inputs.bump }} bump from ${{ steps.version.outputs.previous }})"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Build and zip artifacts
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="env-switcher_${os}_${arch}"
            workdir=$(mktemp -d)
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION -X main.commit=${GITHUB_SHA} -X main.date=$(date -u +%FT%TZ)" \
              -o "$workdir/env-switcher" ./cmd/env-switcher
            chmod +x "$workdir/env-switcher"
            (cd "$workdir" && zip -q -X "$OLDPWD/dist/${name}.zip" env-switcher)
          done
          cd dist && sha256sum *.zip > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS
