name: CI Linux
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.1
          cache: true
      - run: sudo apt-get update && sudo apt-get install --yes zsh
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -run=^$ -fuzz=FuzzParseDoesNotPanic -fuzztime=5s ./internal/config
      - run: go test -run=^$ -fuzz=FuzzQuote -fuzztime=5s ./internal/shell
      - run: go test -race ./...
      - run: go build -trimpath ./cmd/env-switcher
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/env-switcher-linux-arm64 ./cmd/env-switcher
